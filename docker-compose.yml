services:
  postgres:
    # pgvector 官方映像 = postgres:17 + vector 擴充；官方 postgres 映像裝不了
    # CREATE EXTENSION vector（附錄 F），其餘用法與 postgres:17 完全相同
    image: pgvector/pgvector:pg17
    container_name: pg-ai-image
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: ai_image_db
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis-ai-image
    ports:
      - "6379:6379"

volumes:
  pg-data:
