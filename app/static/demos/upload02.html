<!DOCTYPE html>
<html lang="zh-Hant">
<!-- 教材 4.3 之二：上傳後顯示後端產生的縮圖

  打的是 /upload-and-process：後端收檔後用 Pillow 縮圖、轉成 JPEG 再存一份。
  前端拿回縮圖檔名後顯示——完整走完「前端送出 → 後端處理 → 前端呈現」一圈。
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>AJAX 上傳 + 後端縮圖</title>
</head>
<body class="container py-4">
  <h1 class="mb-3">上傳並顯示後端產生的縮圖</h1>
  <button type="button" class="btn btn-primary" onclick="my_file.click()">選擇並上傳</button>
  <div class="mt-3" style="max-width: 400px">
    <img id="my_img" class="img-fluid rounded border" alt="">
  </div>
  <pre id="out" class="mt-3 small"></pre>

  <form name="form1" hidden>
    <input type="file" name="file" id="my_file" accept="image/*">
  </form>

  <script>
    const my_file = document.querySelector('#my_file');

    my_file.addEventListener('change', async () => {
      const fd = new FormData(document.form1);
      out.textContent = '上傳中…';

      const r = await fetch('http://localhost:8000/api/v1/images/upload-and-process', {
        method: 'POST',
        body: fd,
      });
      const result = await r.json();
      out.textContent = JSON.stringify(result, null, 2);

      if (r.ok && result.thumbnail) {
        my_img.src = `http://localhost:8000/uploads/${result.thumbnail}`;
      }
    });
  </script>
</body>
</html>
