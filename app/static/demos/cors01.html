<!DOCTYPE html>
<html lang="zh-Hant">
<!-- 教材 2.6：CORS 實測頁

  用法（重點是「網頁」與「API」要在不同來源）：
  1. 在這個檔上按右鍵 → Open with Live Server，瀏覽器會開在 127.0.0.1:5500，
     而 API 在 localhost:8000——埠不同，就是跨來源。
     （沒裝 Live Server 的話：切到本目錄執行 python -m http.server 5500）
  2. 先「不要」在 main.py 加 CORSMiddleware，按「載入資料」——
     Console 出現 CORS 錯誤，畫面沒有資料。
  3. 加上 CORSMiddleware 後重新整理，同一顆按鈕就拿得到資料了。

  重點：錯誤是「瀏覽器擋下來的」，不是伺服器沒回應。切到開發者工具的 Network
  分頁會看到請求其實成功了（200），只是 JavaScript 讀不到回應內容；
  解掉之後回應標頭會多一行 access-control-allow-origin。

  注意：不要用 file:// 直接點兩下開——那樣的來源是 null，錯誤訊息不一樣，
  而且無法用 allow_origins 授權。
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CORS 測試</title>
</head>
<body>
  <h1>CORS 測試</h1>
  <p>開啟開發者工具的 Console 與 Network 分頁再按下面的按鈕。</p>
  <button onclick="loadData()">載入資料</button>
  <pre id="out"></pre>

  <script>
    const loadData = () => {
      // 用 Live Server 開這一頁時，網頁在 127.0.0.1:5500、API 在 localhost:8000，
      // 協定相同但主機字串與埠都不同——跨來源（教材 2.6 的同源三要素）
      fetch('http://localhost:8000/health')
        .then(r => r.json())
        .then(obj => { out.textContent = JSON.stringify(obj, null, 2) })
        .catch(err => { out.textContent = '失敗：' + err + '\n（看 Console 的 CORS 錯誤訊息）' })
    }
  </script>
</body>
</html>
