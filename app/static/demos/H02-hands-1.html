<!DOCTYPE html>
<html lang="zh-Hant">
<!-- 教材 附錄 D「MediaPipe 進階」三種做法之一（H02）：單張圖片上傳，後端推論

  選檔或用攝影機拍一張 → POST /api/v1/hands/upload → 後端存檔、偵測、寫資料庫，
  回傳 21 個關鍵點的正規化座標，骨架由這一頁的 canvas 自己畫。
  後端在 app/routes/hands.py（教材 8.7）；完整流程與設計取捨見 docs/H02-hands-upload.md。

  三頁對照：H02 一次上傳一張圖／H03 用 WebSocket 連續串流到後端／H04 完全在瀏覽器裡跑。
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>手部關鍵點標示</title>
    <style>
        /* 讓 canvas 精準疊在圖片上面 */
        .stage {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }

        .stage img,
        .stage canvas {
            max-width: 100%;
            display: block;
        }

        .stage canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h4>MediaPipe 手部關鍵點</h4>
        <p class="text-secondary">
            選一張有手的照片、或直接用攝影機拍一張，後端會回傳每隻手 21 個關鍵點的
            正規化座標，骨架由這一頁的 canvas 依座標畫出來（後端不產生標註圖）。
            圖檔與偵測結果的 JSON 會以相同主檔名一起存進 uploads/。
        </p>

        <!-- 這一列要用 div 包起來自成一個區塊。
             下面的 .stage 是 inline-block，如果按鈕跟它排在同一行，
             按鈕會被 960px 高的 inline-block 拉到基線去，整個掉到圖片底下 -->
        <div class="mb-3">
            <button type="button" class="btn btn-primary" onclick="my_file.click()">選擇圖檔</button>
            <button type="button" class="btn btn-outline-primary" id="my_cam_btn">開啟攝影機</button>
            <button type="button" class="btn btn-success" id="my_shot_btn" disabled>拍照並偵測</button>
            <span id="my_status" class="ms-2 text-secondary"></span>
        </div>

        <!-- 攝影機預覽，按下「開啟攝影機」才顯示。
             限制高度，才不會把下面的偵測結果擠到要捲很久才看得到 -->
        <div id="my_cam_box" class="mb-3" hidden>
            <!-- 預覽鏡射成「照鏡子」的樣子，跟拍下來的照片方向一致。
                 注意這只是顯示效果，實際拍照時要另外在 canvas 上鏡射一次 -->
            <video id="my_video" autoplay playsinline muted class="border"
                   style="max-width: 100%; max-height: 240px; transform: scaleX(-1);"></video>
        </div>

        <div class="stage">
            <img src="" alt="" id="my_img">
            <canvas id="my_canvas"></canvas>
        </div>

        <pre id="my_output" class="mt-3 bg-light p-2 small" style="max-height: 300px; overflow: auto;"></pre>
    </div>

    <form name="form1" hidden>
        <input type="file" name="file" id="my_file" accept="image/*">
    </form>

    <script>
        // 手部骨架的連線表，對應後端 HandLandmarksConnections.HAND_CONNECTIONS
        // 座標索引：0 手腕、1~4 拇指、5~8 食指、9~12 中指、13~16 無名指、17~20 小指
        const HAND_CONNECTIONS = [
            [0, 1], [1, 2], [2, 3], [3, 4],           // 拇指
            [0, 5], [5, 6], [6, 7], [7, 8],           // 食指
            [5, 9], [9, 10], [10, 11], [11, 12],      // 中指
            [9, 13], [13, 14], [14, 15], [15, 16],    // 無名指
            [13, 17], [17, 18], [18, 19], [19, 20],   // 小指
            [0, 17],                                  // 掌根到小指根
        ];

        // 每個元素都用 const 宣告接起來。
        // 瀏覽器雖然會把 id 自動變成全域變數，但遇到 status、name、length 這種
        // window 本來就有的屬性就會踩雷（例如 window.status 是字串，
        // 寫 status.textContent = '...' 不會出錯、也不會有任何效果），所以不要依賴它。
        const my_file = document.querySelector('#my_file');
        const my_img = document.querySelector('#my_img');
        const my_canvas = document.querySelector('#my_canvas');
        const my_status = document.querySelector('#my_status');
        const my_output = document.querySelector('#my_output');
        const my_cam_btn = document.querySelector('#my_cam_btn');
        const my_shot_btn = document.querySelector('#my_shot_btn');
        const my_cam_box = document.querySelector('#my_cam_box');
        const my_video = document.querySelector('#my_video');

        // 上一張預覽圖的 blob 網址，換圖時要釋放掉，不然會一直佔記憶體
        let previewUrl = null;

        // 選檔上傳
        my_file.addEventListener('change', function () {
            if (!my_file.files.length) return;
            detectBlob(my_file.files[0]);
        });

        // 開啟／關閉攝影機（同一顆按鈕切換）
        my_cam_btn.addEventListener('click', function () {
            if (my_video.srcObject) {
                closeCamera();
                return;
            }

            // 用 Promise 版的 navigator.mediaDevices.getUserMedia，
            // 不要用網路上舊文章常見、已經廢棄的 callback 版 navigator.getUserMedia。
            // 另外攝影機只在安全環境（HTTPS 或 localhost）才拿得到，
            // 用區網 IP 開這一頁會失敗，要透過 cloudflared 開 HTTPS 通道（教材 4.5）。
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(stream => {
                    my_video.srcObject = stream;
                    my_cam_box.hidden = false;
                    my_shot_btn.disabled = false;
                    my_cam_btn.textContent = '關閉攝影機';
                    my_status.textContent = '攝影機已開啟，把手放進畫面後按「拍照並偵測」';
                })
                .catch(err => {
                    // 使用者按了「封鎖」是 NotAllowedError，沒有鏡頭是 NotFoundError
                    my_status.textContent = `無法開啟攝影機：${err.name}`;
                    console.log(err);
                });
        });

        function closeCamera() {
            // 一定要逐一 stop() 每個 track，只把 srcObject 設成 null 不會關掉鏡頭，
            // 攝影機的指示燈會一直亮著
            my_video.srcObject.getTracks().forEach(track => track.stop());
            my_video.srcObject = null;
            my_cam_box.hidden = true;
            my_shot_btn.disabled = true;
            my_cam_btn.textContent = '開啟攝影機';
            my_status.textContent = '攝影機已關閉';
        }

        // 拍下當下的影格並直接上傳
        my_shot_btn.addEventListener('click', function () {
            // 先把影片當下的畫面畫進一張暫時的 canvas。
            // videoWidth / videoHeight 是攝影機的實際解析度，
            // 跟 <video> 在畫面上被 CSS 縮成多大無關，一定要用前者才不會失真。
            const shot = document.createElement('canvas');
            shot.width = my_video.videoWidth;
            shot.height = my_video.videoHeight;

            // 畫進去的時候要「左右鏡射」，理由有兩個：
            //  1. 自拍視角要跟照鏡子一樣，抬右手時照片右邊要是右手
            //  2. MediaPipe 判定 Left / Right 時假設輸入影像已經鏡射過，
            //     直接存原始的前鏡頭畫面，左右手標籤會全部相反
            // 上面 <video> 的 CSS 也做了鏡射，但那只影響「看起來的樣子」，
            // 這裡不做的話拍下來的像素仍然是沒鏡射的原圖。H03、H04 同樣的處理
            const shotCtx = shot.getContext('2d');
            shotCtx.scale(-1, 1);
            shotCtx.translate(-shot.width, 0);
            shotCtx.drawImage(my_video, 0, 0);

            // toBlob 是非同步的，壓成 JPEG 之後才拿得到 blob
            shot.toBlob(blob => detectBlob(blob, 'webcam.jpg'), 'image/jpeg', 0.9);
        });

        // 選檔與拍照共用這一段：顯示預覽 → 上傳 → 畫骨架
        function detectBlob(blob, filename) {
            if (previewUrl) URL.revokeObjectURL(previewUrl);
            previewUrl = URL.createObjectURL(blob);
            my_img.src = previewUrl;   // 先顯示預覽，不必等後端回應

            my_status.textContent = '偵測中...';
            my_output.textContent = '';

            // 手動組 FormData：欄位名要叫 file，與後端 UploadFile 參數同名。
            // 第三個參數是檔名，後端用它取副檔名，省略的話會變成 "blob"
            const fd = new FormData();
            fd.append('file', blob, filename || blob.name);

            // 打 /upload 而不是 /detect：後端會把圖檔存進 uploads/、
            // 把偵測結果寫進資料庫，另外再存一份同主檔名的 .json
            fetch('/api/v1/hands/upload', {
                method: 'POST',
                body: fd
            })
                .then(r => r.json().then(body => ({ ok: r.ok, body })))
                .then(({ ok, body }) => {
                    // FastAPI 的 HTTPException 回的是 {"detail": "..."}，
                    // 不先判斷就直接讀 hand_count 會拿到 undefined
                    if (!ok) {
                        my_status.textContent = `錯誤：${body.detail}`;
                        return;
                    }
                    my_status.textContent =
                        `偵測到 ${body.hand_count} 隻手（原圖 ${body.width}x${body.height}，` +
                        `推論用 ${body.processed_width}x${body.processed_height}）` +
                        `，已存檔 ${body.filename} / ${body.json_filename}`;
                    my_output.textContent = JSON.stringify(body, null, 2);
                    draw(body);
                })
                .catch(err => {
                    my_status.textContent = '請求失敗';
                    console.log(err);
                });
        }

        function draw(result) {
            // canvas 的內部解析度用原圖尺寸，CSS 再縮放到跟 <img> 一樣大，
            // 這樣線條在放大縮小時都不會糊掉
            my_canvas.width = result.width;
            my_canvas.height = result.height;

            const ctx = my_canvas.getContext('2d');
            ctx.clearRect(0, 0, my_canvas.width, my_canvas.height);

            // 線寬隨圖片大小調整，小圖才不會被粗線蓋住
            const unit = Math.max(result.width, result.height) / 200;

            result.hands.forEach(hand => {
                // 回傳的是 0~1 的正規化座標，要乘上寬高換成像素位置
                const points = hand.landmarks.map(p => ({
                    x: p.x * result.width,
                    y: p.y * result.height,
                }));

                // 左右手用不同顏色，一眼看得出 handedness 判定結果
                const color = hand.handedness === 'Left' ? '#00c853' : '#2979ff';

                ctx.strokeStyle = color;
                ctx.lineWidth = unit;
                HAND_CONNECTIONS.forEach(([a, b]) => {
                    ctx.beginPath();
                    ctx.moveTo(points[a].x, points[a].y);
                    ctx.lineTo(points[b].x, points[b].y);
                    ctx.stroke();
                });

                ctx.fillStyle = '#ff1744';
                points.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, unit * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 在手腕（第 0 點）旁邊標出左右手與信心分數。
                // 先描白邊再填色，這樣壓在深色背景或骨架上都還看得清楚
                const label = `${hand.handedness} ${hand.score}`;
                ctx.font = `bold ${unit * 6}px sans-serif`;
                ctx.lineWidth = unit;
                ctx.strokeStyle = '#ffffff';
                ctx.strokeText(label, points[0].x, points[0].y + unit * 9);
                ctx.fillStyle = color;
                ctx.fillText(label, points[0].x, points[0].y + unit * 9);
            });
        }
    </script>
</body>

</html>
