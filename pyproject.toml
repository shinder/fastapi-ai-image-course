[project]
name = "my-fastapi"
version = "0.1.0"
description = "FastAPI 與 AI 影像應用開發 範例專案"
readme = "README.md"
authors = [
    { name = "Shinder Lin", email = "shinder.lin@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[all]>=0.140.0",
    "sqlmodel>=0.0.39",
    "psycopg[binary]>=3.3.0",
    "pillow>=12.0.0",
    "redis>=8.1.0",
    "ollama>=0.6.0",
    "requests>=2.34.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pymongo>=4.13.0",
    # 下限設 2.0：教材 9.5 的 init_beanie(database=AsyncMongoClient()[db]) 寫法
    # 需要 Beanie 2.x（改用 PyMongo 原生 async）；1.x 是搭 Motor 的舊介面。
    "beanie>=2.0",
]

[project.scripts]
# uv run my-fastapi 會呼叫 src/my_fastapi/__init__.py 的 serve()（啟動開發伺服器；
# 不叫 main() 是因為會被 main.py 子模組蓋掉，見 __init__.py 的說明）
my-fastapi = "my_fastapi:serve"

[build-system]
# uv init 預設產生的 src 佈局（教材 2.2）：有這一段，uv sync 會把 src/my_fastapi 以可編輯模式
# 裝進 .venv，之後不管從哪個目錄執行、測試放在哪裡，import my_fastapi 都找得到
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
# 附錄 D：本機 Hugging Face 影像分類
ml = [
    "transformers>=4.45.0",
    "torch>=2.4.0",
]
# 附錄 D：OCR 文字辨識
ocr = [
    "easyocr>=1.7.0",
    "numpy>=2.0.0",
]
# 附錄 D：OpenAI gpt-image-1 影像生成（也可給 8.6 Ollama 的 OpenAI 相容介面使用）
openai = [
    "openai>=1.50.0",
]
# 教材 8.7：MediaPipe 手部／臉部／姿勢偵測（輕量本機模型）
mediapipe = [
    # 下限設 0.10.30：Apple Silicon(arm64) 的 wheel 從這個版本才開始提供。
    # 注意 Intel Mac(x86_64) 的 wheel 在 0.10.21 之後就停止供應，兩者沒有交集，
    # 因此本專案不支援 Intel Mac 跑 MediaPipe（教材 8.7 有說明替代作法）。
    "mediapipe>=0.10.30",
]
# 附錄 F：pgvector 向量搜尋
vector = [
    "pgvector>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
# 可選依賴（uv sync --extra ...）沒裝時，或套件本身沒有型別標記時，不要讓 mypy 因此報錯
[[tool.mypy.overrides]]
module = [
    "transformers",
    "transformers.*",
    "openai",
    "easyocr",
    "mediapipe",
    "mediapipe.*",
]
ignore_missing_imports = true
