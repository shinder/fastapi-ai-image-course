[project]
name = "my-fastapi"
version = "0.1.0"
description = "FastAPI 與 AI 影像應用開發 範例專案"
readme = "README.md"
authors = [
    { name = "Shinder Lin", email = "shinder.lin@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[all]>=0.143.0",
    "sqlmodel>=0.0.48",
    "psycopg[binary]>=3.3.6",
    "pillow>=12.3.0",
    "redis>=8.1.0",
    "ollama>=0.6.3",
    "requests>=2.34.2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "pymongo>=4.18.3",
    # 下限設 2.0：教材 9.5 的 init_beanie(database=AsyncMongoClient()[db]) 寫法
    # 需要 Beanie 2.x（改用 PyMongo 原生 async）；1.x 是搭 Motor 的舊介面。
    "beanie>=2.2.0",
]

[project.scripts]
# uv run my-fastapi 會呼叫 src/my_fastapi/__init__.py 的 serve()（啟動開發伺服器；
# 不叫 main() 是因為會被 main.py 子模組蓋掉，見 __init__.py 的說明）
my-fastapi = "my_fastapi:serve"

[build-system]
# uv init 預設產生的 src 佈局（教材 2.2）：有這一段，uv sync 會把 src/my_fastapi 以可編輯模式
# 裝進 .venv，之後不管從哪個目錄執行、測試放在哪裡，import my_fastapi 都找得到
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
# 附錄 D：本機 Hugging Face 影像分類
ml = [
    "transformers>=5.19.0",
    "torch>=2.14.1",
]
# 附錄 D：OCR 文字辨識
ocr = [
    "easyocr>=1.7.2",
    "numpy>=2.5.3",
]
# 附錄 D：OpenAI gpt-image-1 影像生成（也可給 8.6 Ollama 的 OpenAI 相容介面使用）
openai = [
    "openai>=3.26.1",
]
# 教材 8.7：MediaPipe 手部／臉部／姿勢偵測（輕量本機模型）
mediapipe = [
    # wheel 不綁 Python 版本（py3-none），3.14 可直接用；平台只有 macOS arm64、Windows、Linux，
    # 沒有 Intel Mac（x86_64 的 wheel 停在 0.10.21），本專案不支援 Intel Mac 跑 MediaPipe。
    "mediapipe>=1.1.0",
]
# 附錄 F：pgvector 向量搜尋
vector = [
    "pgvector>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    # starlette 1.7 起 TestClient 改用 httpx2，沒裝會印棄用警告；只有測試需要，與教材用的 httpx 無關
    "httpx2>=2.13.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
# ruff 0.16 起會連 Markdown 裡的程式碼區塊一起格式化；docs/ 的片段刻意對齊註解，不要動
extend-exclude = ["*.md"]

[tool.ruff.lint]
# ruff 0.16 大幅擴大了預設規則集（UP、B、SIM、ASYNC…）。教學專案維持舊預設（E4/E7/E9/F）
# 加 import 排序（I），避免為了通過檢查改寫教材上刻意示範的寫法
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
# 可選依賴（uv sync --extra ...）沒裝時，或套件本身沒有型別標記時，不要讓 mypy 因此報錯
[[tool.mypy.overrides]]
module = [
    "transformers",
    "transformers.*",
    "openai",
    "easyocr",
    "mediapipe",
    "mediapipe.*",
]
ignore_missing_imports = true
