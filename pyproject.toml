[project]
name = "fastapi-ai-image"
version = "0.1.0"
description = "FastAPI 與 AI 影像應用開發 範例專案"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[all]>=0.140.0",
    "sqlmodel>=0.0.39",
    "psycopg[binary]>=3.3.0",
    "pillow>=12.0.0",
    "redis>=8.1.0",
    "ollama>=0.6.0",
    "requests>=2.34.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pymongo>=4.13.0",
    "beanie>=1.27.0",
]

[project.optional-dependencies]
# 附錄 D：本機 Hugging Face 影像分類
ml = [
    "transformers>=4.45.0",
    "torch>=2.4.0",
]
# 附錄 D：OCR 文字辨識
ocr = [
    "easyocr>=1.7.0",
    "numpy>=2.0.0",
]
# 附錄 D：OpenAI gpt-image-1 影像生成（也可給 7.6 Ollama 的 OpenAI 相容介面使用）
openai = [
    "openai>=1.50.0",
]
# 附錄 D：MediaPipe 手部／臉部／姿勢偵測（輕量本機模型）
mediapipe = [
    # 下限設 0.10.30：Apple Silicon(arm64) 的 wheel 從這個版本才開始提供。
    # 注意 Intel Mac(x86_64) 的 wheel 在 0.10.21 之後就停止供應，兩者沒有交集，
    # 因此本專案不支援 Intel Mac 跑 MediaPipe（附錄 D 有說明替代作法）。
    "mediapipe>=0.10.30",
]
# 附錄 F：pgvector 向量搜尋
vector = [
    "pgvector>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ty.environment]
python = "./.venv"
python-version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]
