<!DOCTYPE html>
<html lang="zh-Hant">
<!-- 教材 附錄 D「MediaPipe 進階」三種做法之三（H04）：瀏覽器端推論

  同一個模型檔（/models/hand_landmarker.task）下載到瀏覽器，用 WebAssembly + WebGL 在本機跑。
  影像完全不離開這台電腦，沒有對應的 API 端點；伺服器只負責供應這個 HTML 與模型檔
  （src/my_fastapi/main.py 的 /models 掛載），後端有沒有安裝 Python 的 mediapipe 都不影響這一頁。
  完整流程與三種做法的比較見 docs/H04-hands-live.md。
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>手部即時追蹤（瀏覽器端）</title>
</head>

<body>
    <div class="container py-4">
        <h4>MediaPipe 手部即時追蹤 — 跑在瀏覽器端</h4>
        <p class="text-secondary">
            這一頁的推論完全在瀏覽器裡用 WebAssembly 跑，影像不會離開這台電腦，
            伺服器只負責供應這個 HTML 與模型檔。
            對照 H02：那一頁是把圖片上傳給後端的 Python 判斷。
        </p>

        <div class="mb-3">
            <button type="button" class="btn btn-primary" id="my_start_btn" disabled>載入模型中...</button>
            <span id="my_status" class="ms-2 text-secondary"></span>
        </div>

        <!-- video 只當作畫面來源，不直接顯示；
             真正給使用者看的是下面那張 canvas（影像與骨架都畫在同一張上） -->
        <video id="my_video" autoplay playsinline muted hidden></video>
        <canvas id="my_canvas" class="border" style="max-width: 100%;"></canvas>

        <div class="mt-3">
            <span class="badge text-bg-secondary" id="my_fps">-- fps</span>
            <span class="badge text-bg-secondary" id="my_latency">推論 -- ms</span>
            <span class="badge text-bg-secondary" id="my_hands">0 隻手</span>
        </div>
    </div>

    <script type="module">
        // 從 CDN 直接載入 ESM 版，版本固定在 0.10.35（網址裡寫死，不會自己升級）。
        // 這是 JavaScript 套件，跟後端 Python 的 mediapipe 是各自獨立安裝的兩份實作，
        // 版本不必相同也能跑；兩邊共用的只有同一個 .task 模型檔。
        // 這一頁沒有 npm、沒有打包工具，就是瀏覽器原生的 module import。
        import {
            FilesetResolver,
            HandLandmarker,
            DrawingUtils,
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";

        const my_video = document.querySelector('#my_video');
        const my_canvas = document.querySelector('#my_canvas');
        const my_status = document.querySelector('#my_status');
        const my_start_btn = document.querySelector('#my_start_btn');
        const my_fps = document.querySelector('#my_fps');
        const my_latency = document.querySelector('#my_latency');
        const my_hands = document.querySelector('#my_hands');

        const ctx = my_canvas.getContext('2d');
        const drawingUtils = new DrawingUtils(ctx);

        let handLandmarker = null;
        let running = false;
        let lastVideoTime = -1;      // 影片時間沒變就不用重跑推論
        let lastResult = null;

        // 載入 WASM 與模型。約 11 MB 的 wasm + 7.5 MB 的模型，第一次會等幾秒，
        // 之後瀏覽器會快取。所以在按鈕按下前就先載好。
        my_status.textContent = '正在下載 WebAssembly 與模型...';
        const fileset = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm"
        );
        handLandmarker = await HandLandmarker.createFromOptions(fileset, {
            baseOptions: {
                // 從自己的伺服器抓，不必連外網（見 src/my_fastapi/main.py 的 /models 掛載）
                modelAssetPath: "/models/hand_landmarker.task",
                delegate: "GPU",     // 走 WebGL，比 CPU 快很多
            },
            runningMode: "VIDEO",    // 有跨影格的追蹤狀態，比逐張 IMAGE 快
            numHands: 2,
            minHandDetectionConfidence: 0.5,
            minHandPresenceConfidence: 0.5,
            minTrackingConfidence: 0.5,
        });
        // 預熱：第一次推論要編譯 GPU shader，實測會卡將近 5 秒。
        // 不先做掉的話，使用者一按下按鈕整頁就凍住，還會以為沒反應而狂點，
        // 那些點擊會在解凍後一次補送出來，把剛開好的攝影機又關掉。
        // 這裡先用一張空白畫布跑一次，把這個一次性成本挪到載入階段。
        my_status.textContent = '正在初始化 GPU（第一次會久一點）...';
        const warmup = document.createElement('canvas');
        warmup.width = 640;
        warmup.height = 480;
        warmup.getContext('2d').fillRect(0, 0, 640, 480);
        handLandmarker.detectForVideo(warmup, performance.now());

        my_status.textContent = '模型已就緒';
        my_start_btn.disabled = false;
        my_start_btn.textContent = '開啟攝影機';

        my_start_btn.addEventListener('click', () => {
            if (running) {
                stopCamera();
            } else {
                startCamera();
            }
        });

        function startCamera() {
            // 開啟過程中先把按鈕鎖住，避免重複點擊
            my_start_btn.disabled = true;
            my_status.textContent = '正在開啟攝影機...';

            // 攝影機只在安全環境（HTTPS 或 localhost）拿得到，
            // 用區網 IP 開這頁會失敗，要用 cloudflared 開 HTTPS 通道（教材 4.5）
            navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false })
                .then(stream => {
                    my_video.srcObject = stream;
                    // 等第一格畫面真的可以讀了再開始，否則 videoWidth 還是 0。
                    // 用 requestVideoFrameCallback 比 loadeddata 可靠：
                    // 同一個 video 元素重複開關時，loadeddata 不一定會再次觸發
                    my_video.requestVideoFrameCallback(() => {
                        my_canvas.width = my_video.videoWidth;
                        my_canvas.height = my_video.videoHeight;
                        running = true;
                        my_start_btn.disabled = false;
                        my_start_btn.textContent = '關閉攝影機';
                        my_status.textContent = '推論中（完全在本機瀏覽器）';
                        requestAnimationFrame(loop);
                    });
                })
                .catch(err => {
                    my_start_btn.disabled = false;
                    my_status.textContent = `無法開啟攝影機：${err.name}`;
                    console.log(err);
                });
        }

        function stopCamera() {
            running = false;
            my_video.srcObject.getTracks().forEach(t => t.stop());
            my_video.srcObject = null;
            my_start_btn.textContent = '開啟攝影機';
            my_status.textContent = '攝影機已關閉';
            ctx.clearRect(0, 0, my_canvas.width, my_canvas.height);
        }

        // 用來算 fps 的移動平均
        const frameTimes = [];

        function loop() {
            if (!running) return;

            // 先把攝影機畫面「左右鏡射」畫進 canvas。
            // 鏡射有兩個理由：
            //  1. 自拍視角要跟照鏡子一樣，抬右手時畫面右邊要動
            //  2. MediaPipe 判定 Left/Right 時假設輸入影像「已經鏡射過」，
            //     直接餵原始的前鏡頭畫面，左右手標籤會全部相反
            ctx.save();
            ctx.scale(-1, 1);
            ctx.translate(-my_canvas.width, 0);
            ctx.drawImage(my_video, 0, 0, my_canvas.width, my_canvas.height);
            ctx.restore();

            // 影片時間沒前進就沿用上一次的結果，不必重跑推論。
            // 螢幕 120Hz 但攝影機只有 30fps 時，這一行省掉一半以上的計算
            if (my_video.currentTime !== lastVideoTime) {
                lastVideoTime = my_video.currentTime;
                const t0 = performance.now();
                // 注意餵給模型的是「已鏡射的 canvas」而不是原始的 video，
                // 這樣座標系跟畫面一致，左右手標籤也才會對
                lastResult = handLandmarker.detectForVideo(my_canvas, performance.now());
                const dt = performance.now() - t0;

                my_latency.textContent = `推論 ${dt.toFixed(1)} ms`;

                // 分頁切到背景時 requestAnimationFrame 會整個停住（這是瀏覽器
                // 正常的省電行為，切回來會自動續跑）。但暫停前後的時戳中間有個
                // 好幾秒的大洞，一起拿去平均會把 fps 算成 0，所以先把舊資料丟掉。
                const now = performance.now();
                if (frameTimes.length && now - frameTimes[frameTimes.length - 1] > 1000) {
                    frameTimes.length = 0;
                }
                frameTimes.push(now);
                while (frameTimes.length > 30) frameTimes.shift();
                if (frameTimes.length > 1) {
                    const span = frameTimes[frameTimes.length - 1] - frameTimes[0];
                    my_fps.textContent = `${((frameTimes.length - 1) / span * 1000).toFixed(0)} fps`;
                } else {
                    my_fps.textContent = '-- fps';
                }
            }

            if (lastResult) {
                my_hands.textContent = `${lastResult.landmarks.length} 隻手`;
                lastResult.landmarks.forEach((landmarks, i) => {
                    // handednesses 是新的欄位名（舊版叫 handedness，已標記為過時）
                    const category = lastResult.handednesses[i][0];
                    const color = category.categoryName === 'Left' ? '#00c853' : '#2979ff';

                    // DrawingUtils 是 tasks-vision 內建的，不必自己維護連線表；
                    // HandLandmarker.HAND_CONNECTIONS 就是 21 點的骨架定義
                    drawingUtils.drawConnectors(landmarks, HandLandmarker.HAND_CONNECTIONS, {
                        color: color,
                        lineWidth: 4,
                    });
                    drawingUtils.drawLandmarks(landmarks, {
                        color: '#ff1744',
                        radius: 4,
                    });

                    // 在手腕（第 0 點）旁標出左右手與信心分數
                    const wrist = landmarks[0];
                    const label = `${category.categoryName} ${category.score.toFixed(2)}`;
                    ctx.font = 'bold 20px sans-serif';
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#ffffff';
                    ctx.strokeText(label, wrist.x * my_canvas.width, wrist.y * my_canvas.height + 30);
                    ctx.fillStyle = color;
                    ctx.fillText(label, wrist.x * my_canvas.width, wrist.y * my_canvas.height + 30);
                });
            }

            requestAnimationFrame(loop);
        }
    </script>
</body>

</html>
