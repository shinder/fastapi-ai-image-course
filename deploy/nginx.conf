# nginx 設定範例（教材 附錄 G：VM 部署）
#
# 放到 /etc/nginx/sites-available/my-fastapi，再 ln -s 到 sites-enabled/，
# sudo nginx -t 檢查語法後 sudo systemctl reload nginx。
# 路徑假設專案 clone 在 /srv/my-fastapi，網域與憑證路徑請換成自己的。

# 80 埠只做一件事：全部轉到 https
server {
    listen 80;
    server_name myapp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name myapp.example.com;

    # 憑證（certbot 申請 Let's Encrypt 後的預設位置）
    ssl_certificate     /etc/letsencrypt/live/myapp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myapp.example.com/privkey.pem;

    # 與教材 3.5 程式裡的 MAX_SIZE（10 MB）一致：超過的上傳由 nginx 直接回 413，
    # 根本不會送到 FastAPI；兩邊數字不同時，以較小的那個為準
    client_max_body_size 10m;

    # 靜態檔案由 nginx 直接送，不經過 Python（教材 4.1、3.6、附錄 D 的三個掛載點）。
    # alias 的目錄要給 nginx 的執行帳號（通常是 www-data）讀取權限。
    location /static/  { alias /srv/my-fastapi/src/my_fastapi/static/; }
    location /uploads/ { alias /srv/my-fastapi/uploads/; }
    location /models/  { alias /srv/my-fastapi/ml_models/; }

    # WebSocket（教材 附錄 D 的 H03 串流）：要把 Upgrade 標頭往後傳，連線才升級得了；
    # 串流會持續很久，read timeout 要拉長，否則 nginx 一分鐘沒資料就斷線
    location /api/v1/hands/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # 其餘全部轉給 uvicorn
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # 讓後端知道原始的用戶端 IP 與協定：
        # 附錄 E 的限流靠 request.client.host 分辨使用者，
        # 6.7 的 url_for 靠協定決定產生 http 還是 https 網址
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 推論可能跑數十秒（教材 8.4），預設 60 秒夠用，但模型大時可再放寬
        proxy_read_timeout 120s;
    }
}
